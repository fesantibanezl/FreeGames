<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de registro para nuevos usuarios de FreeGames.">
  <title>Registro | FreeGames</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header compact">
    <a class="brand" href="index.html" aria-label="Ir al inicio de FreeGames">
      <span class="brand-mark" aria-hidden="true">FG</span>
      <span>FreeGames</span>
    </a>
  </header>

  <nav class="main-nav" aria-label="Navegación principal">
    <a href="index.html">Inicio</a>
    <a href="accion.html">Acción</a>
    <a href="aventura.html">Aventura</a>
    <a href="deportes.html">Deportes</a>
    <a href="carreras.html">Carreras</a>
    <a href="estrategia.html">Estrategia</a>
    <a class="active register-link" aria-current="page" href="registro.html">Registrarse</a>
  </nav>

  <main class="registration-page">
    <section class="registration-intro" aria-labelledby="registration-title">
      <p class="eyebrow">Únete a la comunidad</p>
      <h1 id="registration-title">Crea tu cuenta</h1>
      <p>Completa tus datos para formar parte de FreeGames. Los campos marcados con * son obligatorios.</p>
    </section>

    <section class="registration-card" aria-label="Datos de registro">
      <form class="registration-form" id="registro-form" action="#" method="post">
        <fieldset>
          <legend>Datos personales</legend>

          <div class="form-grid">
            <div class="form-group full-width">
              <label for="nombre-completo">Nombre completo <span aria-hidden="true">*</span></label>
              <input type="text" id="nombre-completo" name="nombre_completo" autocomplete="name" placeholder="Ejemplo: Alex González" required>
            </div>

            <div class="form-group">
              <label for="nombre-usuario">Nombre de usuario <span aria-hidden="true">*</span></label>
              <input type="text" id="nombre-usuario" name="nombre_usuario" autocomplete="username" placeholder="Ejemplo: alexgamer" required>
            </div>

            <div class="form-group">
              <label for="correo">Correo electrónico <span aria-hidden="true">*</span></label>
              <input type="email" id="correo" name="correo" autocomplete="email" placeholder="nombre@correo.cl" required>
            </div>

            <div class="form-group">
              <label for="clave">Contraseña <span aria-hidden="true">*</span></label>
              <input type="password" id="clave" name="clave" autocomplete="new-password" placeholder="Entre 6 y 18 caracteres" required>
            </div>

            <div class="form-group">
              <label for="repetir-clave">Repetir contraseña <span aria-hidden="true">*</span></label>
              <input type="password" id="repetir-clave" name="repetir_clave" autocomplete="new-password" placeholder="Escribe nuevamente tu contraseña" required>
            </div>

            <div class="form-group">
              <label for="fecha-nacimiento">Fecha de nacimiento <span aria-hidden="true">*</span></label>
              <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" autocomplete="bday" required>
            </div>

            <div class="form-group full-width">
              <label for="direccion">Dirección de despacho <span class="optional">(opcional)</span></label>
              <textarea id="direccion" name="direccion" rows="3" autocomplete="street-address" placeholder="Calle, número, comuna y ciudad"></textarea>
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button class="button button-primary" type="submit">Crear cuenta</button>
          <button class="button button-secondary" type="reset">Limpiar formulario</button>
        </div>
      </form>
    </section>
  </main>

  <footer><p>© 2026 FreeGames · Tu catálogo gamer</p></footer>
</body>
</html>
